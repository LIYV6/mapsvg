<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线路图svg版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/sql.js@1.8.0/dist/sql-wasm.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="loading-overlay" style="position:absolute; top:0; left:0; width:100%; height:100%;
background:#f0f2f5; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#1a1a2e; font-family:inherit;">
    <div style="font-size:2rem; margin-bottom:12px;">⏳</div>
    <div style="font-size:1rem;">正在加载数据库...</div>
    <div style="font-size:0.8rem; margin-top:8px; color:#666;">请稍候</div>
</div>

<button id="toggle-sidebar" class="shifted" title="侧边栏">☰</button>
<!-- 状态提示条 -->
<div id="statusBar" class="status-bar empty">未选中任何内容</div>
<!-- 左侧面板 -->
<div id="sidebar">
    <h2 class="sidebar-header">🚇 线路列表（可多选）</h2>

    <div class="category-bar" id="categoryBar">
        <button class="category-btn" data-category="all">全部</button>
        <button class="category-btn active" data-category="metro">🚇 地铁</button>
        <button class="category-btn" data-category="high_speed">🚄 高铁</button>
        <button class="category-btn" data-category="airplane">✈️ 飞机</button>
        <button class="category-btn" data-category="boat">🚢 轮船</button>
        <button class="category-btn" data-category="cable_car">🚡 缆车</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索线路 (名称/中文/英文)" />
    </div>
    <div class="lines-list" id="linesList"></div>
    <!-- 取消选中按钮（始终显示，无选中时禁用） -->
    <div class="deselect-actions" id="deselectActions">
        <button class="deselect-btn deselect-all" id="deselectAllBtn" disabled>取消所有选中</button>
        <button class="deselect-btn deselect-last" id="deselectLastBtn" disabled>取消最近一次选中</button>
    </div>
</div>

<!-- 右侧固定站点信息面板 -->
<div id="detail-panel">
    <div class="detail-header">
        <h2>📌 站点详情</h2>
        <button class="detail-close-btn" id="closeDetailBtn" title="隐藏面板">&times;</button>
    </div>
    <div class="detail-content" id="detailContent">
        <div class="section" id="detailName"><em>请点击站点查看</em></div>
        <div class="section" id="detailLines"></div>
        <div class="section" id="detailExits"></div>
    </div>
</div>

<div id="map"></div>

<!-- 右下角自定义控件组 -->
<div class="custom-controls">
    <button class="ctrl-btn ctrl-zoom-in" id="ctrlZoomIn" title="放大">+</button>
    <button class="ctrl-btn ctrl-zoom-out" id="ctrlZoomOut" title="缩小">−</button>
    <button class="ctrl-btn ctrl-reset" id="ctrlReset" title="重置视图">⟳</button>
</div>
<!-- 右下角访问主站提示 -->
<a class="site-credit" href="https://metro.liyv.me" target="_blank" title="访问主站">访问主站请前往 metro.liyv.me</a>
<script src="script.js"></script>
</body>
</html>
